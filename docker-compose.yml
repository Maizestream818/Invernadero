services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: invernadero_app
    ports:
      - "8080:80"
    volumes:
      - .:/var/www/html
    environment:
      DB_HOST: ${DB_HOST:-db}
      DB_NAME: ${DB_NAME:-invernadero_iot}
      DB_USER: ${DB_USER:-invernadero_user}
      DB_PASSWORD: ${DB_PASSWORD:-invernadero_pass}
    depends_on:
      db:
        condition: service_healthy

  db:
    image: mysql:8.0
    container_name: invernadero_db
    ports:
      - "3306:3306"
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE:-invernadero_iot}
      MYSQL_USER: ${MYSQL_USER:-invernadero_user}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-invernadero_pass}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root_pass}
    volumes:
      - mysql_data:/var/lib/mysql
      - ./sql/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -u$${MYSQL_USER} -p$${MYSQL_PASSWORD} --silent"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  phpmyadmin:
    image: phpmyadmin/phpmyadmin
    container_name: invernadero_phpmyadmin
    ports:
      - "8081:80"
    environment:
      PMA_HOST: db
    depends_on:
      db:
        condition: service_healthy

volumes:
  mysql_data:
